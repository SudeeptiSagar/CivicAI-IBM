[project]
name = "civicai"
version = "0.1.0"
description = "CivicAI - AI-powered Urban Complaint Intelligence & Response System"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
# Everything the API and the agents need at runtime. The app image installs
# exactly this extra, so an agent and the API can never drift apart.
server = [
    "psycopg[binary,pool]>=3.2",
    "redis>=5.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "boto3>=1.35",
    "pillow>=11.0",
]
dev = [
    "civicai[server]",
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-jsonschema>=4.23",
    "httpx>=0.27",
    "boto3-stubs[s3]>=1.35",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["common*", "bus*", "agents*", "api*", "db*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs the docker compose stack (postgres/redis). Skipped when unreachable.",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["common", "bus", "agents", "api", "db", "scripts", "tests"]
